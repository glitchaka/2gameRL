name: Build, test and release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-e2e:
    name: Windows end-to-end
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run unit tests
        shell: pwsh
        run: mvn -B -ntp clean test package

      - name: Deterministic wait timer create and BoxCollider smoke
        shell: pwsh
        run: |
          $log = & "$env:JAVA_HOME\bin\java.exe" -cp "target\test-classes;target\app-input\*" com.buttclapdev.twogamerl.runtime.RuntimeFeatureSmokeApp 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) { throw "El smoke determinista de runtime fallo." }
          foreach ($required in @('BOXCOLLIDER_STATIC_OK','TIMER_CREATE_OK','WAIT_DESTROY_CREATE_OK')) {
            if ($log -notmatch [regex]::Escape($required)) { throw "No se verifico el comportamiento: $required" }
          }

      - name: Create Windows smoke projects
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target\smoke | Out-Null
          & "$env:JAVA_HOME\bin\java.exe" -cp "target\test-classes;target\app-input\*" com.buttclapdev.twogamerl.SmokeProjectCreator target\smoke\default.2grl
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el proyecto smoke principal." }
          & "$env:JAVA_HOME\bin\java.exe" -cp "target\test-classes;target\app-input\*" com.buttclapdev.twogamerl.ComponentSmokeProjectCreator components target\smoke\components.2grl
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el proyecto smoke de componentes." }
          & "$env:JAVA_HOME\bin\java.exe" -cp "target\test-classes;target\app-input\*" com.buttclapdev.twogamerl.ComponentSmokeProjectCreator portal target\smoke\portal.2grl
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el proyecto smoke de portal." }

      - name: Runtime and script smoke test on Windows
        shell: pwsh
        run: |
          $stdout = "target\runtime-smoke.log"
          $stderr = "target\runtime-smoke.err.log"
          $p = Start-Process -FilePath "$env:JAVA_HOME\bin\java.exe" -ArgumentList '-Dtwogamerl.project=target\smoke\default.2grl','-cp','target\app-input\*','com.buttclapdev.twogamerl.runtime.GameLauncher' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 7
          $p.Refresh()
          if ($p.HasExited) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "El runtime Windows termino antes de tiempo con codigo $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force
          $log = (Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
          Write-Host $log
          if ($log -notmatch '\[Jugador\] Jugador iniciado') { throw "El script start del jugador no se ejecuto en Windows." }

      - name: Built-in components and BoxCollider smoke test on Windows
        shell: pwsh
        run: |
          $stdout = "target\components-smoke.log"
          $stderr = "target\components-smoke.err.log"
          $p = Start-Process -FilePath "$env:JAVA_HOME\bin\java.exe" -ArgumentList '-Dtwogamerl.project=target\smoke\components.2grl','-cp','target\app-input\*','com.buttclapdev.twogamerl.runtime.GameLauncher' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "El runtime de componentes termino antes de tiempo con codigo $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force
          $log = (Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
          Write-Host $log
          foreach ($required in @('PLAYER_START_OK','BOXCOLLIDER_OK','STATIC_COLLIDER_OK','TRIGGER_OK','RIGIDBODY_OK','PATROL_COLLIDER_OK','Health 90/100')) {
            if ($log -notmatch [regex]::Escape($required)) { throw "No se verifico el comportamiento: $required" }
          }
          if ($log -match 'BOXCOLLIDER_FAILED_PASSTHROUGH') { throw "BoxCollider2D permitio atravesar la entidad bloqueadora." }

      - name: ScenePortal smoke test on Windows
        shell: pwsh
        run: |
          $stdout = "target\portal-smoke.log"
          $stderr = "target\portal-smoke.err.log"
          $p = Start-Process -FilePath "$env:JAVA_HOME\bin\java.exe" -ArgumentList '-Dtwogamerl.project=target\smoke\portal.2grl','-cp','target\app-input\*','com.buttclapdev.twogamerl.runtime.GameLauncher' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "El runtime de portal termino antes de tiempo con codigo $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force
          $log = (Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
          Write-Host $log
          if ($log -notmatch 'PORTAL_TARGET_OK') { throw "ScenePortal no cargo la escena destino." }
          if ($log -notmatch 'Player positioned @ 7,8') { throw "ScenePortal no aplico targetX/targetY." }

      - name: Package Windows Studio
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $version = $pom.project.version
          cmd /c "scripts\package-editor.bat $version"
          if ($LASTEXITCODE -ne 0) { throw "El empaquetado Windows fallo con codigo $LASTEXITCODE." }

      - name: Verify packaged Windows toolchain
        shell: pwsh
        run: |
          if (-not (Test-Path "build\2gameRL Studio\2gameRL Studio.exe")) { throw "Falta 2gameRL Studio.exe" }
          if (-not (Test-Path "build\2gameRL Studio\toolchain\bin\jpackage.exe")) { throw "El Studio no contiene jpackage.exe" }
          if (-not (Test-Path "build\2gameRL Studio\toolchain\jmods")) { throw "El Studio no contiene los jmods requeridos por jpackage" }

      - name: Launch packaged 2gameRL Studio.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\2gameRL Studio\2gameRL Studio.exe" -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "2gameRL Studio.exe termino antes de tiempo con codigo $($p.ExitCode)." }
          Stop-Process -Id $p.Id -Force

      - name: Export Windows game using the Studio bundled toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\export-smoke | Out-Null
          & "build\2gameRL Studio\toolchain\bin\java.exe" -cp "build\2gameRL Studio\app\*" com.buttclapdev.twogamerl.export.ExportCli target\smoke\default.2grl build\export-smoke
          if ($LASTEXITCODE -ne 0) { throw "La exportacion desde el Studio empaquetado fallo." }
          if (-not (Test-Path "build\export-smoke\2gameRL-Smoke\2gameRL-Smoke.exe")) { throw "No se genero el ejecutable del juego." }
          if (-not (Test-Path "build\export-smoke\2gameRL-Smoke-portable.zip")) { throw "No se genero el ZIP portable del juego." }

      - name: Launch exported Windows game executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\export-smoke\2gameRL-Smoke\2gameRL-Smoke.exe" -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "El juego Windows exportado termino antes de tiempo con codigo $($p.ExitCode)." }
          Stop-Process -Id $p.Id -Force

      - name: Read version and archive validated Windows Studio
        id: version
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $version = $pom.project.version
          "version=$version" >> $env:GITHUB_OUTPUT
          Compress-Archive -Path "build\2gameRL Studio" -DestinationPath "build\2gameRL-Studio-Windows-v$version.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-studio
          path: build/2gameRL-Studio-Windows-v${{ steps.version.outputs.version }}.zip

  release:
    name: Publish validated Windows Release
    if: github.event_name == 'push'
    needs: [windows-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: windows-studio
          path: release-assets
      - name: Create immutable version release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          print(ET.parse('pom.xml').getroot().findtext('{http://maven.apache.org/POM/4.0.0}version'))
          PY
          )
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: $TAG ya existe. Incrementa la version antes de publicar otro cambio."
            exit 1
          fi
          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "2gameRL Studio ${VERSION} - Windows" \
            --generate-notes
