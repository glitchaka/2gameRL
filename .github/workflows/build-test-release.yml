name: Build, test and release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    name: Test runtime and exporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Compile and run unit tests
        run: mvn -B -ntp clean test package
      - name: Create smoke project
        run: |
          mkdir -p target/smoke
          java -cp "target/test-classes:target/app-input/*" com.buttclapdev.twogamerl.SmokeProjectCreator target/smoke/default.2grl
      - name: Launch Studio smoke test
        shell: bash
        run: |
          set +e
          timeout 8s xvfb-run -a java -cp "target/app-input/*" com.buttclapdev.twogamerl.studio.DesktopLauncher > target/studio-smoke.log 2>&1
          code=$?
          set -e
          cat target/studio-smoke.log
          if [ "$code" -ne 124 ]; then
            echo "Studio exited unexpectedly with code $code"
            exit "$code"
          fi
      - name: Runtime script startup smoke test
        shell: bash
        run: |
          set +e
          timeout 8s xvfb-run -a java -Dtwogamerl.project=target/smoke/default.2grl -cp "target/app-input/*" com.buttclapdev.twogamerl.runtime.GameLauncher > target/runtime-smoke.log 2>&1
          code=$?
          set -e
          cat target/runtime-smoke.log
          if [ "$code" -ne 124 ]; then
            echo "Runtime exited unexpectedly with code $code"
            exit "$code"
          fi
          grep -F "[Jugador] Jugador iniciado" target/runtime-smoke.log
      - name: Export app-image and portable ZIP
        run: |
          java -cp "target/app-input/*" com.buttclapdev.twogamerl.export.ExportCli target/smoke/default.2grl target/export-smoke
          test -f "target/export-smoke/2gameRL-Smoke-portable.zip"
          test -x "target/export-smoke/2gameRL-Smoke/bin/2gameRL-Smoke"
      - name: Launch exported game smoke test
        shell: bash
        run: |
          set +e
          timeout 8s xvfb-run -a "target/export-smoke/2gameRL-Smoke/bin/2gameRL-Smoke" > target/exported-runtime-smoke.log 2>&1
          code=$?
          set -e
          cat target/exported-runtime-smoke.log
          if [ "$code" -ne 124 ]; then
            echo "Exported game exited unexpectedly with code $code"
            exit "$code"
          fi
          grep -F "[Jugador] Jugador iniciado" target/exported-runtime-smoke.log

  package-windows:
    name: Package Windows Studio
    needs: test-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package application
        shell: cmd
        run: scripts\package-editor.bat
      - name: Read version and archive
        id: version
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $version = $pom.project.version
          "version=$version" >> $env:GITHUB_OUTPUT
          Compress-Archive -Path "build\2gameRL Studio\*" -DestinationPath "build\2gameRL-Studio-Windows-v$version.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-studio
          path: build/2gameRL-Studio-Windows-v${{ steps.version.outputs.version }}.zip

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [test-linux, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: windows-studio
          path: release-assets
      - name: Create immutable release for this change
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          print(ET.parse('pom.xml').getroot().findtext('{http://maven.apache.org/POM/4.0.0}version'))
          PY
          )
          SHORT_SHA="${GITHUB_SHA:0:8}"
          TAG="v${VERSION}-${SHORT_SHA}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to overwrite."
            exit 0
          fi
          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "2gameRL Studio ${VERSION} · ${SHORT_SHA}" \
            --generate-notes
