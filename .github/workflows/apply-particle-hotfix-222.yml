name: Apply 2.2.2 particle hotfix

on:
  push:
    branches: [hotfix/2.2.2-particles]
    paths:
      - tools/apply_particle_hotfix_222.py
      - .github/workflows/apply-particle-hotfix-222.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/2.2.2-particles
          fetch-depth: 0
      - name: Apply particle hotfix source changes
        run: python3 tools/apply_particle_hotfix_222.py
      - name: Commit staged hotfix without workflow mutations
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/apply-particle-hotfix-222.yml .github/workflows/build-test-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced by particle hotfix applicator."
            exit 1
          fi
          git commit -m "fix: complete 2.2.2 particle system hotfix"
          git push origin HEAD:hotfix/2.2.2-particles
