name: Fix 2.2 MenuButton ambiguity

on:
  push:
    branches: [release/2.2.0-visual-pipeline]
    paths: [.github/workflows/fix-2.2-menubutton-ambiguity.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2.2.0-visual-pipeline
      - name: Qualify model MenuButton
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/com/buttclapdev/twogamerl/studio/GraphicsEditorPane.java')
          s=p.read_text(encoding='utf-8')
          old='for(MenuButton b:m.buttons)'
          count=s.count(old)
          if count != 2:
              raise SystemExit(f'Se esperaban 2 referencias ambiguas, encontradas: {count}')
          s=s.replace(old,'for(GameProject.MenuButton b:m.buttons)')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit source correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/buttclapdev/twogamerl/studio/GraphicsEditorPane.java
          git commit -m "fix: disambiguate model MenuButton in graphics editor"
          git push origin HEAD:release/2.2.0-visual-pipeline
