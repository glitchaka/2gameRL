name: Add 2.2 E2E coverage

on:
  push:
    branches: [release/2.2.0-visual-pipeline]

permissions:
  contents: write

jobs:
  patch-e2e:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2.2.0-visual-pipeline
      - name: Add 2.2 runtime smoke to release workflow
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/build-test-release.yml')
          s=p.read_text(encoding='utf-8')
          anchor='      - name: Create Windows smoke projects\n'
          block='''      - name: 2.2 visual pipeline runtime smoke on Windows\n        shell: pwsh\n        run: |\n          $log = & "$env:JAVA_HOME\\bin\\java.exe" -cp "target\\test-classes;target\\app-input\\*" com.buttclapdev.twogamerl.runtime.VisualPipeline22SmokeApp 2>&1 | Out-String\n          Write-Host $log\n          if ($LASTEXITCODE -ne 0) { throw "El smoke del pipeline visual 2.2 fallo." }\n          foreach ($required in @('PLATFORMER_GROUNDED_JUMP_OK','ANIMATOR_FRAME_EVENT_OK','PREFAB_SPAWN_OK')) {\n            if ($log -notmatch [regex]::Escape($required)) { throw "No se verifico el comportamiento 2.2: $required" }\n          }\n\n'''
          if '2.2 visual pipeline runtime smoke on Windows' not in s:
              if anchor not in s: raise SystemExit('No se encontró el ancla de smoke projects.')
              s=s.replace(anchor,block+anchor,1)
          verify='          if (-not (Test-Path "build\\2gameRL Studio\\2gameRL Studio.exe")) { throw "Falta 2gameRL Studio.exe" }\n'
          icon='          if (-not (Test-Path "build\\2rl-icon.ico")) { throw "Falta el icono Windows 2RL generado" }\n'
          if icon not in s:
              if verify not in s: raise SystemExit('No se encontró el ancla de verificación del paquete.')
              s=s.replace(verify,icon+verify,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit E2E coverage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-test-release.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: validate 2.2 visual runtime in Windows E2E"
          git push origin HEAD:release/2.2.0-visual-pipeline
