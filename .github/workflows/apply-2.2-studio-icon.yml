name: Wire 2RL Studio icon

on:
  push:
    branches: [release/2.2.0-visual-pipeline]

permissions:
  contents: write

jobs:
  patch-studio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2.2.0-visual-pipeline
      - name: Use generated JavaFX icon
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main/java/com/buttclapdev/twogamerl/studio/StudioApp.java')
          s=p.read_text(encoding='utf-8')
          marker='import com.buttclapdev.twogamerl.export.NativeExporter;'
          if 'import com.buttclapdev.twogamerl.AppIcon;' not in s:
              s=s.replace(marker,'import com.buttclapdev.twogamerl.AppIcon;\n'+marker,1)
          old='private static void loadWindowIcon(Stage target){try(InputStream in=StudioApp.class.getResourceAsStream("/com/buttclapdev/twogamerl/2rl-icon.png")){if(in!=null)target.getIcons().add(new Image(in));}catch(Exception ignored){}}'
          new='private static void loadWindowIcon(Stage target){try{target.getIcons().add(AppIcon.create(256));}catch(Exception ignored){}}'
          if old not in s:
              raise SystemExit('No se encontró loadWindowIcon esperado.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit icon wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/buttclapdev/twogamerl/studio/StudioApp.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: use generated 2RL icon in Studio windows"
          git push origin HEAD:release/2.2.0-visual-pipeline
