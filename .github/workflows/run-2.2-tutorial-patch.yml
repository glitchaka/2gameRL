name: Apply 2.2 tutorial migration

on:
  push:
    branches: [release/2.2.0-visual-pipeline]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2.2.0-visual-pipeline
      - name: Patch integrated tutorial
        run: python3 scripts/patch_tutorial_22.py
      - name: Commit tutorial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/buttclapdev/twogamerl/studio/ScriptTutorialDialog.java
          git commit -m "docs: make integrated tutorial a complete 2.2 API reference"
          git push origin HEAD:release/2.2.0-visual-pipeline
