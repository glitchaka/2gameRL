name: Finalize RC integration

on:
  push:
    branches:
      - 'release/2.3.0-rc1'

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'ci: stage final RC integration fixes' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final RC integration fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/main/java/com/buttclapdev/twogamerl/studio/StudioApp.java')
          s = app.read_text(encoding='utf-8')
          old = 'String title="2gameRL Studio 2.2 · "+project.getTitle()+(dirty?"  ●":"");'
          new = 'String title="2gameRL Studio 2.3.0-rc1 · "+project.getTitle()+(dirty?"  ●":"");'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one legacy Studio title, found {s.count(old)}')
          app.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')

          wf = Path('.github/workflows/build-test-release.yml')
          y = wf.read_text(encoding='utf-8')
          y = y.replace('actions/setup-java@v4', 'actions/setup-java@v5')
          marker = '      - name: Create Windows smoke projects\n'
          rc_step = '''      - name: 2.3.0 RC runtime smoke on Windows
        shell: pwsh
        run: |
          $log = & "$env:JAVA_HOME\\bin\\java.exe" -cp "target\\test-classes;target\\app-input\\*" com.buttclapdev.twogamerl.runtime.Release230RcRuntimeSmokeApp 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) { throw "El smoke runtime 2.3.0 RC fallo." }
          foreach ($required in @('RC_ANIMATOR_PARAM_BLEND_OK','RC_DIRECTIONAL_REVERSE_FPS_OK','RC_FRAME_HITBOX_HURTBOX_OK','RC_CAMERA_ADVANCED_OK')) {
            if ($log -notmatch [regex]::Escape($required)) { throw "No se verifico el comportamiento 2.3.0 RC: $required" }
          }

'''
          if '2.3.0 RC runtime smoke on Windows' not in y:
              if y.count(marker) != 1:
                  raise SystemExit(f'Expected one Windows smoke marker, found {y.count(marker)}')
              y = y.replace(marker, rc_step + marker, 1)
          wf.write_text(y, encoding='utf-8', newline='\n')
          PY
          git config user.name "glitchaka"
          git config user.email "82622846+glitchaka@users.noreply.github.com"
          git add src/main/java/com/buttclapdev/twogamerl/studio/StudioApp.java .github/workflows/build-test-release.yml
          git commit -m "fix: finalize 2.3.0 RC integration"
          git push origin HEAD:release/2.3.0-rc1