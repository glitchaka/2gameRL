name: Apply RC4 Studio shell transform

on:
  push:
    branches:
      - hotfix/2.3.0-rc4-studio-shell

permissions:
  contents: write

jobs:
  transform:
    if: "${{ github.event.head_commit.message == 'chore: run rc4 shell transform' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply RC4 shell finalization
        run: python3 .github/scripts/apply_rc4_shell.py
      - name: Commit transformed files
        run: |
          git config user.name "glitchaka"
          git config user.email "82622846+glitchaka@users.noreply.github.com"
          git add pom.xml src/main/java/com/buttclapdev/twogamerl/studio/AssetExplorerPane.java src/main/java/com/buttclapdev/twogamerl/studio/StudioApp.java src/main/java/com/buttclapdev/twogamerl/studio/ProjectSettingsDialog.java
          git commit -m "feat: finalize rc4 studio shell and labels"
          git push origin HEAD:hotfix/2.3.0-rc4-studio-shell
