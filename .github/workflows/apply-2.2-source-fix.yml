name: Apply 2.2 runtime source correction

on:
  push:
    branches: [release/2.2.0-visual-pipeline]

permissions:
  contents: write

jobs:
  patch-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2.2.0-visual-pipeline
      - name: Patch grounded sensor timing and test input hooks
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main/java/com/buttclapdev/twogamerl/runtime/GameView.java')
          s = p.read_text(encoding='utf-8')
          old = 'frameContacts=new HashSet<>();for(Body b:bodies.values()){b.grounded=b.touchingLeft=b.touchingRight=b.touchingTop=false;}fireWorld(ScriptProgram.Event.UPDATE);'
          new = 'frameContacts=new HashSet<>();for(Body b:bodies.values()){b.grounded=b.touchingLeft=b.touchingRight=b.touchingTop=false;}refreshContactSensors();fireWorld(ScriptProgram.Event.UPDATE);'
          if old not in s:
              raise SystemExit('No se encontró el punto de actualización de sensores esperado.')
          s = s.replace(old, new, 1)
          old_hooks = 'public double debugRenderScale(){return level==null?0:viewport().scale;}'
          new_hooks = 'public double debugRenderScale(){return level==null?0:viewport().scale;}public void debugPressKey(String key){try{KeyCode code=KeyCode.valueOf(key.toUpperCase(Locale.ROOT));if(keys.add(code))pressed.add(code);}catch(Exception ignored){}}public void debugReleaseKey(String key){try{keys.remove(KeyCode.valueOf(key.toUpperCase(Locale.ROOT)));}catch(Exception ignored){}}'
          if old_hooks not in s:
              raise SystemExit('No se encontró el bloque de hooks de debug esperado.')
          s = s.replace(old_hooks, new_hooks, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/buttclapdev/twogamerl/runtime/GameView.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: keep grounded state available to platformer input"
          git push origin HEAD:release/2.2.0-visual-pipeline
