name: Apply RC feature pack

on:
  push:
    branches: [release/2.3.0-rc1]
    paths:
      - tools/apply_rc_feature_pack.py
      - .github/workflows/apply-rc-feature-pack.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2.3.0-rc1
          fetch-depth: 0
      - name: Apply RC implementation phase
        run: python3 tools/apply_rc_feature_pack.py
      - name: Commit product changes only
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/apply-rc-feature-pack.yml tools/apply_rc_feature_pack.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No product changes produced."
            exit 1
          fi
          git commit -m "feat: implement RC feature pack"
          git push origin HEAD:release/2.3.0-rc1
