name: Apply RC3 asset explorer transforms

on:
  push:
    branches:
      - hotfix/2.3.0-rc3-resource-explorer

permissions:
  contents: write

jobs:
  transform:
    if: "${{ github.event.head_commit.message == 'chore: stage rc3 asset explorer transforms' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply model persistence version and theme transforms
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'Missing token in {path}: {old[:120]}')
              p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')

          gp='src/main/java/com/buttclapdev/twogamerl/model/GameProject.java'
          replace(gp,
              '    private final LinkedHashMap<String, StampPattern> stampPatterns = new LinkedHashMap<>();\n    private final List<String> renderLayers = new ArrayList<>();',
              '    private final LinkedHashMap<String, StampPattern> stampPatterns = new LinkedHashMap<>();\n    private final LinkedHashSet<String> assetFolders = new LinkedHashSet<>();\n    private final List<String> renderLayers = new ArrayList<>();')
          replace(gp,
              'c.animationSets.clear();animationSets.forEach((k,v)->c.animationSets.put(k,v.copy()));c.stampPatterns.clear();stampPatterns.forEach((k,v)->c.stampPatterns.put(k,v.copy()));return c;',
              'c.animationSets.clear();animationSets.forEach((k,v)->c.animationSets.put(k,v.copy()));c.stampPatterns.clear();stampPatterns.forEach((k,v)->c.stampPatterns.put(k,v.copy()));c.assetFolders.clear();c.assetFolders.addAll(assetFolders);return c;')
          replace(gp,
              'public Map<String,AnimationSet> getAnimationSets(){return animationSets;} public Map<String,StampPattern> getStampPatterns(){return stampPatterns;}',
              'public Map<String,AnimationSet> getAnimationSets(){return animationSets;} public Map<String,StampPattern> getStampPatterns(){return stampPatterns;} public Set<String> getAssetFolders(){return assetFolders;}')

          rc='src/main/java/com/buttclapdev/twogamerl/io/RcProjectIO.java'
          replace(rc,
              'int i=0;for(Asset a:p.getAssets().values()){String k="asset."+i+++".";x.setProperty(k+"key",a.key);x.setProperty(k+"folder",safe(a.folder));x.setProperty(k+"favorite",Boolean.toString(a.favorite));}x.setProperty("asset.count",Integer.toString(i));',
              'int i=0;for(Asset a:p.getAssets().values()){String k="asset."+i+++".";x.setProperty(k+"key",a.key);x.setProperty(k+"folder",safe(a.folder));x.setProperty(k+"favorite",Boolean.toString(a.favorite));}x.setProperty("asset.count",Integer.toString(i));int folderIndex=0;for(String folder:p.getAssetFolders())x.setProperty("assetFolder."+folderIndex++,safe(folder));x.setProperty("assetFolder.count",Integer.toString(folderIndex));')
          replace(rc,
              'for(int i=0;i<num(x,"asset.count",0);i++){String k="asset."+i+".";Asset a=p.getAssets().get(x.getProperty(k+"key",""));if(a!=null){a.folder=x.getProperty(k+"folder","");a.favorite=bool(x,k+"favorite",false);}}',
              'for(int i=0;i<num(x,"asset.count",0);i++){String k="asset."+i+".";Asset a=p.getAssets().get(x.getProperty(k+"key",""));if(a!=null){a.folder=x.getProperty(k+"folder","");a.favorite=bool(x,k+"favorite",false);}}p.getAssetFolders().clear();for(int fi=0;fi<num(x,"assetFolder.count",0);fi++){String folder=x.getProperty("assetFolder."+fi,"").trim();if(!folder.isBlank())p.getAssetFolders().add(folder);}')

          replace('src/main/java/com/buttclapdev/twogamerl/studio/StudioApp.java','String title="2gameRL Studio 2.2 · "+project.getTitle()','String title="2gameRL Studio 2.3 RC3 · "+project.getTitle()')
          replace('pom.xml','<version>2.3.0-rc2</version>','<version>2.3.0-rc3</version>')

          themes=Path('src/main/resources/com/buttclapdev/twogamerl/themes.css')
          s=themes.read_text(encoding='utf-8')
          start=s.index('.theme-graphite {')
          end=s.index('\n.theme-light {',start)
          graphite='''.theme-graphite { -fx-base:#1b1a18; -fx-background:#11110f; -fx-control-inner-background:#1c1b18; -fx-accent:#c9a45f; -fx-focus-color:#c9a45f; -fx-faint-focus-color:rgba(201,164,95,.16); -fx-text-fill:#ece9e2; }
.theme-graphite.studio-root,.theme-graphite.tutorial-window,.theme-graphite.pixel-editor { -fx-background-color:linear-gradient(to bottom right,#181816,#11110f 62%,#0d0d0c); }
.theme-graphite .title-bar,.theme-graphite .menu-bar,.theme-graphite .main-toolbar,.theme-graphite .context-toolbar,.theme-graphite .side-panel,.theme-graphite .tutorial-navigation { -fx-background-color:rgba(27,27,24,.88); -fx-border-color:rgba(255,255,255,.075); }
.theme-graphite .window-app-mark { -fx-background-color:linear-gradient(to bottom,#d0ad68,#ad843e); -fx-text-fill:#17130d; }
.theme-graphite .label { -fx-text-fill:#e3e0d9; } .theme-graphite .muted { -fx-text-fill:#96938c; } .theme-graphite .panel-title,.theme-graphite .tutorial-note { -fx-text-fill:#cfb77f; }
.theme-graphite .button,.theme-graphite .toggle-button { -fx-background-color:rgba(255,255,255,.045); -fx-text-fill:#dedbd4; -fx-border-color:rgba(255,255,255,.11); }
.theme-graphite .button:hover,.theme-graphite .toggle-button:hover { -fx-background-color:rgba(255,255,255,.085); -fx-border-color:rgba(255,255,255,.18); }
.theme-graphite .toggle-button:selected,.theme-graphite .workspace-button:selected { -fx-background-color:rgba(201,164,95,.14); -fx-border-color:#c9a45f; -fx-text-fill:#fffaf0; }
.theme-graphite .primary-button { -fx-background-color:linear-gradient(to bottom,#d3b06d,#ad833e); -fx-border-color:#dfbf7b; -fx-text-fill:#17130d; }
.theme-graphite .text-field,.theme-graphite .text-area,.theme-graphite .combo-box,.theme-graphite .combo-box-base,.theme-graphite .list-view,.theme-graphite .tree-view,.theme-graphite .table-view,.theme-graphite .color-picker,.theme-graphite .spinner { -fx-background-color:rgba(255,255,255,.035); -fx-border-color:rgba(255,255,255,.105); -fx-text-fill:#efede8; }
.theme-graphite .text-area .content,.theme-graphite .tree-cell,.theme-graphite .list-cell { -fx-background-color:transparent; -fx-text-fill:#d2cfc8; }
.theme-graphite .tree-cell:filled:selected,.theme-graphite .list-cell:filled:selected,.theme-graphite .table-row-cell:filled:selected { -fx-background-color:rgba(201,164,95,.15); -fx-text-fill:#fff8e9; }
.theme-graphite .canvas-shell,.theme-graphite .scroll-pane>.viewport,.theme-graphite .editor-scroll>.viewport { -fx-background-color:rgba(7,7,6,.48); }
.theme-graphite .component-card { -fx-background-color:rgba(255,255,255,.035); -fx-border-color:rgba(255,255,255,.09); }
.theme-graphite .tab-pane .tab-header-area .tab-header-background { -fx-background-color:rgba(19,19,17,.84); } .theme-graphite .tab-pane .tab { -fx-background-color:transparent; } .theme-graphite .tab-pane .tab:selected { -fx-background-color:rgba(201,164,95,.10); -fx-border-color:transparent transparent #c9a45f transparent; }
.theme-graphite .status-bar { -fx-background-color:rgba(20,20,18,.88); -fx-text-fill:#97948c; -fx-border-color:rgba(255,255,255,.07) transparent transparent transparent; }
'''
          themes.write_text(s[:start]+graphite+s[end:],encoding='utf-8',newline='\n')

          css=Path('src/main/resources/com/buttclapdev/twogamerl/studio.css')
          extra='''

/* Desktop resource explorer ------------------------------------------------ */
.asset-explorer { -fx-background-color: rgba(10,10,9,.30); -fx-border-color: rgba(255,255,255,.07); -fx-border-radius: 6; -fx-background-radius: 6; }
.resource-toolbar { -fx-padding: 7; -fx-background-color: rgba(255,255,255,.025); -fx-border-color: transparent transparent rgba(255,255,255,.065) transparent; }
.breadcrumb-button { -fx-background-color: transparent; -fx-border-color: transparent; -fx-padding: 4 6; -fx-text-fill: #c8c4ba; }
.breadcrumb-button:hover { -fx-background-color: rgba(255,255,255,.06); -fx-text-fill: #f1eadc; }
.compact-toggle { -fx-padding: 4 7; }
.resource-scroll,.resource-scroll>.viewport { -fx-background-color: transparent; }
.resource-grid { -fx-background-color: transparent; }
.resource-list { -fx-background-color: transparent; }
.resource-tile { -fx-padding: 9; -fx-background-color: transparent; -fx-border-color: transparent; -fx-border-radius: 7; -fx-background-radius: 7; -fx-cursor: hand; }
.resource-tile:hover { -fx-background-color: rgba(255,255,255,.045); -fx-border-color: rgba(255,255,255,.07); }
.resource-tile.selected,.resource-row.selected { -fx-background-color: rgba(201,164,95,.13); -fx-border-color: rgba(201,164,95,.72); }
.resource-tile.drop-target,.resource-row.drop-target { -fx-background-color: rgba(201,164,95,.18); -fx-border-color: #c9a45f; }
.resource-row { -fx-padding: 6 8; -fx-background-color: transparent; -fx-border-color: transparent; -fx-border-width: 1; -fx-border-radius: 5; -fx-background-radius: 5; -fx-cursor: hand; }
.resource-row:hover { -fx-background-color: rgba(255,255,255,.04); }
.resource-folder-icon { -fx-fill: #c9a45f; -fx-stroke: #dfbd78; -fx-stroke-width: .6; }
.resource-file-name { -fx-text-fill: #ebe7de; -fx-font-weight: 600; }
.resource-file-type,.resource-path,.resource-status { -fx-text-fill: #8f8b83; -fx-font-size: 11px; }
.asset-thumbnail { -fx-background-color: rgba(0,0,0,.22); -fx-border-color: rgba(255,255,255,.08); -fx-border-radius: 5; -fx-background-radius: 5; }
.asset-thumbnail-fallback { -fx-text-fill: #77736c; -fx-font-size: 9px; -fx-font-weight: bold; }
.favorite-badge { -fx-text-fill: #d6ae60; -fx-effect: dropshadow(gaussian,rgba(0,0,0,.75),3,.15,0,1); }
.theme-graphite .combo-box-popup .list-cell:filled:selected,.theme-graphite .combo-box .list-cell:filled:selected { -fx-background-color: rgba(201,164,95,.16); -fx-text-fill:#fff8e9; }
.theme-graphite .primary-button { -fx-background-color: linear-gradient(to bottom,#d3b06d,#ad833e); -fx-border-color:#dfbf7b; -fx-text-fill:#17130d; }
'''
          current=css.read_text(encoding='utf-8')
          if '/* Desktop resource explorer' not in current: css.write_text(current+extra,encoding='utf-8',newline='\n')
          PY
          git config user.name "glitchaka"
          git config user.email "82622846+glitchaka@users.noreply.github.com"
          git add pom.xml src/main/java/com/buttclapdev/twogamerl/model/GameProject.java src/main/java/com/buttclapdev/twogamerl/io/RcProjectIO.java src/main/java/com/buttclapdev/twogamerl/studio/StudioApp.java src/main/resources/com/buttclapdev/twogamerl/themes.css src/main/resources/com/buttclapdev/twogamerl/studio.css
          git commit -m "feat: persist folders and finalize rc3 visual identity"
          git push origin HEAD:hotfix/2.3.0-rc3-resource-explorer
