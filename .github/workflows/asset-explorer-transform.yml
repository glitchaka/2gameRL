name: Apply RC3 asset explorer transforms

on:
  push:
    branches: [hotfix/2.3.0-rc3-resource-explorer]

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged transform
        shell: bash
        run: |
          if [ "${{ github.event.head_commit.message }}" != "chore: run rc3 asset explorer transform" ]; then
            echo "No transform requested."
            exit 0
          fi
          python3 .github/scripts/apply_rc3.py
          git config user.name "glitchaka"
          git config user.email "82622846+glitchaka@users.noreply.github.com"
          git add pom.xml src/main/java/com/buttclapdev/twogamerl/model/GameProject.java src/main/java/com/buttclapdev/twogamerl/io/RcProjectIO.java src/main/java/com/buttclapdev/twogamerl/studio/StudioApp.java src/main/resources/com/buttclapdev/twogamerl/themes.css src/main/resources/com/buttclapdev/twogamerl/studio.css
          git commit -m "feat: persist folders and finalize rc3 visual identity"
          git push origin HEAD:hotfix/2.3.0-rc3-resource-explorer
