name: Apply visual polish transforms

on:
  push:
    branches:
      - hotfix/2.3.0-rc1-visual-polish

permissions:
  contents: write

jobs:
  transform:
    if: "${{ github.event.head_commit.message == 'style: stage visual polish source transforms' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source-level palette and layout transforms
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, pairs):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f'Missing expected token in {path}: {old}')
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8', newline='\n')

          replace('src/main/java/com/buttclapdev/twogamerl/studio/MenuEditorPane.java', [
              ('#52d3ff', '#c9a45f'),
              ('#29bfff', '#b58a43'),
              ('rgba(12,22,34,.96)', 'rgba(28,27,24,.97)'),
          ])

          replace('src/main/java/com/buttclapdev/twogamerl/studio/ParticleStudio222.java', [
              ('#101722', '#11110f'),
              ('Color.rgb(120,200,255,.45)', 'Color.rgb(201,164,95,.45)'),
              ('#55b7ff', '#c9a45f'),
          ])

          replace('src/main/java/com/buttclapdev/twogamerl/studio/SpritesheetSliceDialog.java', [
              ('Color.rgb(72,184,255,.22)', 'Color.rgb(201,164,95,.22)'),
              ('#7ed1ff', '#d0ad68'),
          ])

          replace('src/main/java/com/buttclapdev/twogamerl/studio/SceneEditorPane.java', [
              ('setDividerPositions(.21,.76)', 'setDividerPositions(.195,.78)'),
              ('box.setPrefWidth(315)', 'box.setPrefWidth(285)'),
              ('toolButton("Seleccionar",group,true,Tool.SELECT)', 'toolButton("Selección",group,true,Tool.SELECT)'),
              ('toolButton("Objeto vacío",group,false,Tool.EMPTY_ENTITY)', 'toolButton("Objeto",group,false,Tool.EMPTY_ENTITY)'),
              ('brushPicker.setPrefWidth(235)', 'brushPicker.setPrefWidth(205)'),
              ('zoomScale.setPrefWidth(70)', 'zoomScale.setPrefWidth(62)'),
              ('HBox tools=new HBox(7,selectTool,drawTool,fill,erase,empty', 'HBox tools=new HBox(5,selectTool,drawTool,fill,erase,empty'),
              ('tools.setPadding(new Insets(8))', 'tools.setPadding(new Insets(6,8,6,8))'),
              ('tabs.setPrefWidth(415)', 'tabs.setPrefWidth(380)'),
          ])
          PY
          git config user.name "glitchaka"
          git config user.email "82622846+glitchaka@users.noreply.github.com"
          git add src/main/java/com/buttclapdev/twogamerl/studio/MenuEditorPane.java \
                  src/main/java/com/buttclapdev/twogamerl/studio/ParticleStudio222.java \
                  src/main/java/com/buttclapdev/twogamerl/studio/SpritesheetSliceDialog.java \
                  src/main/java/com/buttclapdev/twogamerl/studio/SceneEditorPane.java
          git commit -m "style: finish graphite visual polish"
          git push origin HEAD:hotfix/2.3.0-rc1-visual-polish
