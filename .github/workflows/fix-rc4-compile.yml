name: Apply RC4 compile fix

on:
  push:
    branches:
      - hotfix/2.3.0-rc4-studio-shell

permissions:
  contents: write

jobs:
  transform:
    if: "${{ github.event.head_commit.message == 'chore: run rc4 compile fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compile fix
        run: python3 .github/scripts/fix_rc4_compile.py
      - name: Commit fixed source
        run: |
          git config user.name "glitchaka"
          git config user.email "82622846+glitchaka@users.noreply.github.com"
          git add src/main/java/com/buttclapdev/twogamerl/studio/SceneTools222.java
          git commit -m "fix: insert Stamp controls with the JavaFX list overload"
          git push origin HEAD:hotfix/2.3.0-rc4-studio-shell
