name: Apply last directory integration

on:
  push:
    branches:
      - hotfix/2.3.0-rc4-studio-shell

permissions:
  contents: write

jobs:
  transform:
    if: "${{ github.event.head_commit.message == 'chore: run last-directory transform' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integration
        run: python3 .github/scripts/apply_last_directory.py
      - name: Commit transformed files
        run: |
          git config user.name "glitchaka"
          git config user.email "82622846+glitchaka@users.noreply.github.com"
          git add src/main/java/com/buttclapdev/twogamerl/studio/StudioApp.java src/main/java/com/buttclapdev/twogamerl/studio/GraphicsEditorPane.java src/main/java/com/buttclapdev/twogamerl/studio/MenuEditorPane.java
          git commit -m "fix: reopen all Studio file dialogs in the last used directory"
          git push origin HEAD:hotfix/2.3.0-rc4-studio-shell
